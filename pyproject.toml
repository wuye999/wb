[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sellerops"
version = "1.0.0"
description = "Multi-platform seller operations CLI"
requires-python = ">=3.10"
dependencies = ["requests>=2.28,<3", "openpyxl>=3.0,<4"]

[project.optional-dependencies]
browser = ["playwright>=1.40,<2"]

[project.scripts]
sellerops = "sellerops.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
